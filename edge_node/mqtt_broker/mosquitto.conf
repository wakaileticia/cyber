# ==============================================================================
# CONFIGURAÇÃO DO BROKER MQTT (MOSQUITTO) - NÓ DE BORDA VILA AURORA
# Cumpre o requisito RT-04: Identidade única por dispositivo (mTLS)[cite: 4].
# ==============================================================================

# Porta padrão para MQTT sobre TLS (conforme definido no docker-compose)
listener 8883

# Desativa acessos anónimos para garantir que apenas dispositivos autenticados comunicam
allow_anonymous false

# ==============================================================================
# CONFIGURAÇÃO DE CERTIFICADOS E mTLS (RT-04)[cite: 4]
# ==============================================================================

# Caminho para o certificado da Autoridade Certificadora (CA) própria do projeto
cafile /mosquitto/config/certs/ca.crt

# Certificado e chave privada do servidor MQTT (Broker local)
certfile /mosquitto/config/certs/mqtt_server.crt
keyfile /mosquitto/config/certs/mqtt_server.key

# EXIGÊNCIA CRÍTICA: Obriga os clientes (sensores, IA, web) a apresentarem certificado válido
require_certificate true

# Utiliza o Common Name (CN) do certificado do cliente como nome de utilizador
use_identity_as_username true

# Restringe a ligação a protocolos seguros modernos
tls_version tlsv1.2